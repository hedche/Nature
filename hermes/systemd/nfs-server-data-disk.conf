# Installed to /etc/systemd/system/nfs-server.service.d/nature-data-disk.conf
# by deploy-to-hermes.sh.
# The USB data disk is mounted nofail; never export the empty /mnt/data stub
# directory (NFS clients would silently write to the 40 GB OS disk). With the
# disk absent, nfs-server refuses to start; after reattaching:
#   sudo systemctl start nfs-server
[Unit]
RequiresMountsFor=/mnt/data
