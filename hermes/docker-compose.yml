services:
    gluetun:
        image: qmcgaw/gluetun:v3.41.1
        container_name: gluetun
        restart: unless-stopped
        cap_add:
            - NET_ADMIN
        devices:
            - /dev/net/tun:/dev/net/tun
        environment:
            VPN_SERVICE_PROVIDER: nordvpn
            VPN_TYPE: wireguard
            # Interpolated from .env, written on hermes by deploy-to-hermes.sh
            # from the root secrets.yaml. Never committed.
            WIREGUARD_PRIVATE_KEY: ${NORDVPN_WIREGUARD_PRIVATE_KEY:?run deploy-to-hermes.sh so .env is generated from secrets.yaml}
            SERVER_COUNTRIES: ${NORDVPN_SERVER_COUNTRIES:-Netherlands}
            # Allow replies to the Nature LAN (Mac browser, future Sonarr/Radarr)
            # to route out eth0 instead of into the tunnel. LAN-only; torrent
            # traffic still has no route except the VPN.
            FIREWALL_OUTBOUND_SUBNETS: 10.30.1.0/24
            # Required for LAN clients to reach the published ports —
            # without it gluetun's firewall drops inbound connections on eth0
            # (localhost still works, which can mask the problem).
            FIREWALL_INPUT_PORTS: "8080,8888"
            # Built-in HTTP proxy (:8888). Prowlarr on cereal points tagged
            # ISP-blocked indexers at it; traffic entering here egresses via
            # the VPN tunnel. Do NOT route whole *arr apps through it —
            # metadata providers rate-limit/ban shared VPN IPs.
            HTTPPROXY: "on"
            TZ: Europe/London
        ports:
            # qBittorrent WebUI — must be published here: qbittorrent shares
            # gluetun's network namespace and has no ports of its own.
            # Localhost-only on purpose: LAN access is served by the
            # qbittorrent-proxy systemd socket unit (see systemd/ + README),
            # because Tailscale accept-routes on hermes steers Docker DNAT
            # replies into tailscale0 and breaks direct LAN access.
            - "127.0.0.1:8080:8080/tcp"
            # gluetun HTTP proxy — same localhost-only + socket-proxy pattern
            # (gluetun-httpproxy systemd units serve LAN :8888).
            - "127.0.0.1:8888:8888/tcp"
        volumes:
            # OS disk on purpose: survives absence of the USB data disk (nofail).
            - /home/ubuntu/appdata/gluetun:/gluetun

    qbittorrent:
        image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.13-ls467
        container_name: qbittorrent
        restart: unless-stopped
        # Kill switch: all traffic (peers, trackers, DHT, both directions) can
        # only use gluetun's namespace; if the VPN is down there is no route out.
        network_mode: "service:gluetun"
        depends_on:
            gluetun:
                condition: service_healthy
                restart: true # recreate qbittorrent when compose recreates gluetun (compose >= 2.17)
        environment:
            PUID: "1000"
            PGID: "1000"
            TZ: Europe/London
            WEBUI_PORT: "8080"
            TORRENTING_PORT: "6881" # not published: NordVPN has no port forwarding
        volumes:
            # OS disk on purpose (see gluetun volume comment).
            - /home/ubuntu/appdata/qbittorrent:/config
            # Long syntax: refuse to start if /mnt/data (USB, nofail) is absent,
            # instead of Docker silently creating the path on the root filesystem.
            - type: bind
              source: /mnt/data/torrents
              target: /data/torrents
              bind:
                  create_host_path: false
        healthcheck:
            # Proves outbound connectivity through the tunnel; goes unhealthy if
            # gluetun restarts underneath us (broken namespace) or the VPN is down.
            # Deliberately a hostname, not a raw IP: a stale namespace can keep
            # raw-IP connectivity semantics while DNS is broken.
            test: ["CMD-SHELL", "curl -fsS -m 10 https://one.one.one.one >/dev/null || wget -q -T 10 -O /dev/null https://one.one.one.one"]
            interval: 60s
            timeout: 15s
            retries: 3
            start_period: 60s

    plex:
        image: lscr.io/linuxserver/plex:1.43.2.10687-563d026ea-ls312
        container_name: plex
        restart: unless-stopped
        # Host networking on purpose: it is Plex's recommended mode (DLNA/GDM
        # discovery), it keeps Plex OUTSIDE the VPN (only qbittorrent tunnels),
        # and host-sourced replies dodge the Tailscale accept-routes x Docker
        # DNAT breakage that motivated the WebUI socket proxy (see README).
        network_mode: host
        environment:
            PUID: "1000"
            PGID: "1000"
            TZ: Europe/London
            VERSION: docker
            # One-time server claim (https://plex.tv/claim, token valid ~4 min).
            # Forwarded into .env by deploy-to-hermes.sh when PLEX_CLAIM is set.
            PLEX_CLAIM: ${PLEX_CLAIM:-}
        volumes:
            # OS disk on purpose (see gluetun volume comment). Metadata lives
            # here; keep an eye on the 40 GB root disk if the library grows.
            - /home/ubuntu/appdata/plex:/config
            # Media is read-only: Plex only ever needs to read it, and this
            # stack should never modify the library.
            - type: bind
              source: /mnt/data/media
              target: /data/media
              read_only: true
              bind:
                  create_host_path: false
            - type: bind
              source: /mnt/data/torrents
              target: /data/torrents
              read_only: true
              bind:
                  create_host_path: false
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS -m 10 http://127.0.0.1:32400/identity >/dev/null"]
            interval: 60s
            timeout: 15s
            retries: 3
            start_period: 120s

    metube:
        image: ghcr.io/alexta69/metube:2026.08.28
        container_name: metube
        restart: unless-stopped
        # Host networking on purpose: host-sourced replies dodge the Tailscale
        # accept-routes x Docker DNAT breakage (see README), same as Plex.
        # Deliberately NOT behind gluetun: YouTube throttles/blocks shared VPN
        # IPs; home-IP egress is the reliable path. Only torrents tunnel.
        network_mode: host
        environment:
            PUID: "1000"
            PGID: "1000"
            TZ: Europe/London
            # App default, pinned explicitly: 8080/8888/32400 are taken on this host.
            PORT: "8081"
            DOWNLOAD_DIR: /downloads
            # Queue/history state on the OS disk with the other app configs, so
            # it survives the USB data disk being absent. TEMP_DIR stays at its
            # default (= DOWNLOAD_DIR): partials stay on the 1TB disk and the
            # final move is a same-filesystem rename.
            STATE_DIR: /config
            # Playlists land in a per-playlist subfolder, index-prefixed so
            # File Browser lists items in order on the phone.
            OUTPUT_TEMPLATE_PLAYLIST: "%(playlist_title)s/%(playlist_index)03d - %(title)s.%(ext)s"
            # 2 vCPU shared with Plex; ffmpeg merge steps are CPU-heavy.
            MAX_CONCURRENT_DOWNLOADS: "2"
        volumes:
            # OS disk on purpose (see gluetun volume comment).
            - /home/ubuntu/appdata/metube:/config
            # Long syntax: refuse to start if /mnt/data (USB, nofail) is absent.
            - type: bind
              source: /mnt/data/youtube
              target: /downloads
              bind:
                  create_host_path: false
        # No compose healthcheck: the image bakes one in (curl on :$PORT).

    filebrowser:
        image: hurlenko/filebrowser:v2.63.18
        container_name: filebrowser
        restart: unless-stopped
        # Same host-networking rationale as metube/plex (Tailscale x DNAT).
        network_mode: host
        # This image has no PUID/PGID entrypoint; `user:` runs the bare
        # /filebrowser binary as ubuntu (1000:1000) — never root at all.
        user: "1000:1000"
        environment:
            TZ: Europe/London
            # Default 8080 collides with the qBittorrent WebUI socket proxy.
            # NB: FB_* env only works for flags NOT already in the image CMD
            # (flags beat env) — root/database/address must stay CMD defaults.
            FB_PORT: "8082"
            # LAN + tailnet only, non-sensitive content, write scope confined
            # to the youtube mount — no auth keeps this reproducible with zero
            # secret plumbing (repo is public). Auth choice is baked into the
            # DB at first init: to add auth later, wipe appdata/filebrowser and
            # redeploy with FB_USERNAME + FB_PASSWORD from secrets.yaml.
            FB_NOAUTH: "true"
        volumes:
            # OS disk on purpose. filebrowser.db auto-created here on first run.
            - /home/ubuntu/appdata/filebrowser:/config
            # MeTube downloads: the ONLY writable tree (File Browser deletion
            # is the retention policy for it).
            - type: bind
              source: /mnt/data/youtube
              target: /data/youtube
              bind:
                  create_host_path: false
            # Media + torrents are browse/download only: with no auth, a
            # writable mount would let anyone on the LAN/tailnet delete the
            # Plex library or yank files out from under seeding torrents.
            - type: bind
              source: /mnt/data/media
              target: /data/media
              read_only: true
              bind:
                  create_host_path: false
            - type: bind
              source: /mnt/data/torrents
              target: /data/torrents
              read_only: true
              bind:
                  create_host_path: false
        healthcheck:
            # busybox wget (alpine base; no curl in this image).
            test: ["CMD-SHELL", "wget -q -T 10 -O /dev/null http://127.0.0.1:8082/health"]
            interval: 60s
            timeout: 15s
            retries: 3
            start_period: 30s
