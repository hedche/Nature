# Per-node patch for snap (worker, 10.30.1.51)
#
# Hardware: Dell OptiPlex 7060
#   CPU:   Intel i5-8500T (6C/6T @ 2.10GHz)
#   RAM:   16GB (2× 8GB DDR4-2666)
#   NVMe:  Micron 2200S 256GB (nvme0n1) — install disk
#   SATA:  KIOXIA EXCERIA S 960GB (sda) — data
#   NIC:   eno2 (54:bf:64:97:dd:49)
#   USB:   1GB flash (sdb) — PXE boot media

machine:
    network:
        hostname: snap
    install:
        disk: /dev/nvme0n1
