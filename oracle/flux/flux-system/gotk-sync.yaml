# Flux sync for the Oracle (OCI K3s) cluster.
# Mirrors kubernetes/flux/flux-system/gotk-sync.yaml but reconciles ./oracle/flux,
# so this cluster never picks up cereal's apps. Same repo + shared flux-system secret.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  secretRef:
    name: flux-system
  url: https://github.com/hedche/Nature.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./oracle/flux
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
