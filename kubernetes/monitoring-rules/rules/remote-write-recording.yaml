# Pre-aggregation for remote_write.
#
# Grafana Cloud's free tier caps active series at 10k and silently DROPS the
# excess — a partially-dropped dead-man's switch looks exactly like a working
# one, which is the worst failure available. Raw local cardinality is ~50-70k, so
# the per-pod and per-container dimensions are collapsed HERE and only the
# aggregate crosses the wire. cAdvisor alone goes from ~7,000 series to ~10.
#
# Every series produced here is matched by the `nature:.*` term in the
# remote_write allow-list in ../helmrelease.yaml.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nature-remote-write-aggregates
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: monitoring
spec:
  groups:
    - name: nature.remotewrite.aggregates
      interval: 60s
      rules:
        # ~10 namespaces instead of 122 containers.
        - record: nature:container_cpu_usage:sum_by_namespace
          expr: sum by (namespace) (rate(container_cpu_usage_seconds_total{container!="",image!=""}[5m]))
        - record: nature:container_memory_working_set:sum_by_namespace
          expr: sum by (namespace) (container_memory_working_set_bytes{container!="",image!=""})

        # 4 series each, and used by the local NodeMemoryPressure /
        # NodeRootFilesystemFilling alerts as well.
        - record: nature:node_cpu_utilisation:ratio
          expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))
        - record: nature:node_memory_utilisation:ratio
          expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
        - record: nature:node_rootfs_utilisation:ratio
          expr: >-
            1 - (node_filesystem_avail_bytes{mountpoint="/"}
                 / node_filesystem_size_bytes{mountpoint="/"})

        # apiserver_request_duration_seconds_bucket alone is ~15k series locally.
        # Ship one number instead.
        - record: nature:apiserver_request_errors:rate5m
          expr: sum(rate(apiserver_request_total{code=~"5.."}[5m]))

        # THE heartbeat. If this stops arriving in Grafana Cloud, the cluster is
        # gone and the cloud pages you. Do not remove or rename it without also
        # updating ../../../grafana/rules.tf (ClusterSilent).
        #
        # The cloud rule is NOT `absent(nature:cluster_heartbeat)`, for two reasons:
        #   1. Grafana-managed rules treat an empty result as No Data, and absent()
        #      returns empty while the heartbeat is HEALTHY — so paired with
        #      no_data_state=Alerting it fires permanently. See grafana/README.md.
        #   2. Grafana Cloud is a shared tenant across cereal and oracle, so an
        #      unqualified matcher stays satisfied while EITHER cluster is alive and
        #      cereal could die unnoticed. The cluster label comes from
        #      externalLabels in ../../monitoring/helmrelease.yaml.
        # The actual rule is:
        #   max_over_time(nature:cluster_heartbeat{cluster="cereal"}[10m]) or on() vector(0)
        # thresholded below 1.
        - record: nature:cluster_heartbeat
          expr: vector(1)

        # The out-of-band half of PeanutBriefingSilent (nature-peanut.yaml). That
        # rule evaluates INSIDE the cluster, so it only covers "cluster alive,
        # briefing broken" — a dead cereal takes the alert down with it. The
        # briefing is the one workload that fails without telling anyone (run.py
        # logs the traceback and exits 1; a Trello list rename on ~2026-07-30
        # broke every run and went unnoticed for 33 days), so it gets a second,
        # off-site pair of eyes. Consumed by PeanutBriefingSilentCloud in
        # ../../../grafana/rules.tf — do not remove or rename without updating
        # that rule, which would otherwise page permanently via its vector(0)
        # fallback.
        #
        # Why record it rather than allow-list it: kube_cronjob_status_last_
        # successful_time is not in the remote_write allow-list, and that
        # allow-list is a single 67-term regex with a documented history of
        # SILENT breakage (a stray space once made 28 of the 67 unmatchable,
        # including node_power_supply_online). Publishing under `nature:` ships
        # it via the existing `nature:.*` term without touching that regex.
        #
        # The max() is MANDATORY, not tidiness. The raw metric carries
        # kube-state-metrics' pod/instance labels, and the cloud rule reads it
        # through max_over_time(...[30h]), which resurrects dead series for a
        # full 30h. Measured 2026-09-04: kube-state-metrics had been rescheduled
        # 42h earlier and the un-aggregated form still returned the dead pod's
        # series, climbing to 39.6h old and sitting above the 26h cloud threshold
        # for 163 consecutive 5-minute samples — 13.6h of false CRITICAL paging
        # while the briefing ran perfectly every morning. Do not "simplify" this
        # back to the raw metric.
        - record: nature:peanut_briefing_last_success_timestamp_seconds
          expr: max(kube_cronjob_status_last_successful_time{cronjob="peanut-daily-briefing"})
