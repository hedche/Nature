apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: "34.x"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    service:
      type: ClusterIP
    ingressClass:
      enabled: true
      isDefaultClass: false
    providers:
      kubernetesIngress:
        enabled: true
    ports:
      web:
        exposedPort: 80
      websecure:
        exposedPort: 443
    logs:
      general:
        level: INFO
