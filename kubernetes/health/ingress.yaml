apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: health
  namespace: health
  labels:
    app.kubernetes.io/name: health
    app.kubernetes.io/part-of: monitoring
  annotations:
    # The strrl controller creates the tunnel route and the DNS record from this
    # Ingress. No cert-manager involved — Cloudflare terminates TLS at the edge.
    cloudflare-tunnel-ingress-controller.strrl.dev/backend-protocol: http
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: health.cereal.nature.leafbit.uk
      http:
        paths:
          # Prefix, not Exact: the strrl controller skips the whole Ingress with
          # "path type in ingress health/health is Exact, which is not supported",
          # so no tunnel route and no DNS record is ever created. The nginx config
          # in configmap.yaml still answers only /healthz and 404s everything else,
          # so the wider match costs nothing.
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: health
                port:
                  number: 8080
