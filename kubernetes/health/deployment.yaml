apiVersion: apps/v1
kind: Deployment
metadata:
  name: health
  namespace: health
  labels:
    app.kubernetes.io/name: health
    app.kubernetes.io/part-of: monitoring
spec:
  # Two replicas with anti-affinity: this endpoint's whole job is to answer from
  # outside, so a single-node failure must not make it look like a cluster outage.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: health
  template:
    metadata:
      labels:
        app.kubernetes.io/name: health
        app.kubernetes.io/part-of: monitoring
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: health
                topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # nginx writes its temp dirs under /tmp
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap:
            name: health-nginx
