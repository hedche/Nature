# LAN and WAN reachability, probed from inside the cluster.
#
# The cluster moved indoors on 2026-07-25; arctic (.21) followed on 2026-10-01,
# so nothing crosses the garage powerline link any more. hermes (.57) is the NFS
# server the media stack depends on.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: lan-icmp
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: monitoring
spec:
  interval: 60s
  module: icmp
  prober:
    url: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      static:
        - 10.30.1.1 # UniFi gateway
        - 10.30.1.57 # hermes — NFS server for the media stack
        - 10.30.1.60 # hassio — the LAN watchdog itself
        - 10.30.1.20 # qnap
        # Added 2026-09-02. pve is not a cluster node, so nothing watched it — when
        # it lost power alongside crackle, the only signal was hermes (a VM ON pve)
        # going quiet, and the cause had to be inferred. The media stack depends on
        # hermes, which depends on this host.
        - 10.30.1.55 # pve — Proxmox host, runs the hermes VM
        # Re-enabled 2026-10-01: arctic moved indoors onto GbE and is up again
        # (was verified down 2026-08-31 behind the then-dead garage powerline).
        - 10.30.1.21 # arctic — WD MyCloud NAS, NFS exports
      labels:
        job: blackbox-icmp
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: wan-icmp
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: monitoring
spec:
  interval: 60s
  module: icmp
  prober:
    url: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      static:
        - 1.1.1.1
        - 8.8.8.8
      labels:
        job: blackbox-wan
