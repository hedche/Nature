apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: notifications
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/notifications
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Substitutes ${TELEGRAM_CHAT_ID} into the Provider. The Secret is pushed by
  # scripts/secrets.sh; without it the Provider renders with a literal
  # "${TELEGRAM_CHAT_ID}" channel and Telegram returns 400.
  postBuild:
    substituteFrom:
      - kind: Secret
        name: nature-vars
