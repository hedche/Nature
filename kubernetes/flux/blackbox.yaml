apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: blackbox
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/blackbox
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: monitoring # Probe + PrometheusRule CRDs, and the monitoring namespace
