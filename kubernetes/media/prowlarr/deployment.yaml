apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: media
  labels:
    app.kubernetes.io/name: prowlarr
    app.kubernetes.io/part-of: media
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO config PVC: never two pods at once
  selector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prowlarr
        app.kubernetes.io/part-of: media
    spec:
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:2.4.0.5397-ls153
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9696
          envFrom:
            - configMapRef:
                name: media-env
          volumeMounts:
            - name: config
              mountPath: /config
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 60
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        # Indexer manager only — no /data mount: Prowlarr never touches media
        # files. Config (SQLite) must stay on ceph-block, not NFS.
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config
