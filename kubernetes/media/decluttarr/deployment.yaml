apiVersion: apps/v1
kind: Deployment
metadata:
  name: decluttarr
  namespace: media
  labels:
    app.kubernetes.io/name: decluttarr
    app.kubernetes.io/part-of: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: decluttarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: decluttarr
        app.kubernetes.io/part-of: media
    spec:
      containers:
        - name: decluttarr
          image: ghcr.io/manimatter/decluttarr:v2.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            # TZ (and PUID/PGID, harmless here) — same source as the *arrs.
            - configMapRef:
                name: media-env
          env:
            # Resolve the !ENV tags in config.yaml from the media-secrets Secret.
            # The *arr API keys already live there (pinned by scripts/secrets.sh);
            # the qBittorrent WebUI creds are added by the same script.
            - name: SONARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: media-secrets
                  key: SONARR__AUTH__APIKEY
            - name: RADARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: media-secrets
                  key: RADARR__AUTH__APIKEY
            - name: QBIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: media-secrets
                  key: QBIT_WEBUI_USERNAME
            - name: QBIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: media-secrets
                  key: QBIT_WEBUI_PASSWORD
          volumeMounts:
            - name: config
              mountPath: /app/config
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: decluttarr-config
