apiVersion: v1
kind: ConfigMap
metadata:
  name: decluttarr-config
  namespace: media
  labels:
    app.kubernetes.io/name: decluttarr
    app.kubernetes.io/part-of: media
data:
  # decluttarr V2 config. Secrets are pulled from the environment via the !ENV
  # tag (decluttarr's own YAML loader resolves it at runtime — to Kubernetes
  # this is just an opaque string inside a block scalar). The env vars are
  # mapped from the media-secrets Secret in deployment.yaml, so no API key or
  # password is ever committed to this (public) repo.
  config.yaml: |
    general:
      log_level: INFO
      # Live: dry-run confirmed it targeted only dead torrents. Set back to true
      # to return to dry-run at any time.
      test_run: false
      timer: 10   # minutes between queue sweeps

    job_defaults:
      # A torrent must fail the same check on 3 consecutive sweeps (~30 min)
      # before decluttarr acts, so a transient dip never nukes a live download.
      max_strikes: 3
      min_days_between_searches: 7
      max_concurrent_searches: 3

    jobs:
      # Dead grabs — no peers, stuck fetching metadata, or failed. Each is
      # removed from qBittorrent, blocklisted in the *arr, and a replacement is
      # searched. (remove_orphans / remove_bad_files are intentionally left off:
      # they need the media filesystem mounted, which this pod does not have.)
      remove_stalled:
      remove_metadata_missing:
      remove_failed_downloads:
      remove_failed_imports:
      # remove_slow is intentionally OFF: with no global download speed limit in
      # qBittorrent it false-positives on healthy big downloads whenever the pipe
      # is saturated (decluttarr flags them below min_speed even though they have
      # plenty of seeds). remove_stalled already handles genuinely dead (no-peer)
      # torrents. To enable slow-removal safely, first set a global rate limit in
      # qBittorrent (then decluttarr auto-suspends the check when bandwidth is maxed).

    instances:
      sonarr:
        - base_url: http://sonarr:8989
          api_key: !ENV SONARR_API_KEY
      radarr:
        - base_url: http://radarr:7878
          api_key: !ENV RADARR_API_KEY

    download_clients:
      qbittorrent:
        # qBittorrent runs on hermes (behind gluetun), reached over the LAN.
        # name must match the client name Sonarr/Radarr register — "qBittorrent"
        # (kubernetes/media/configure-media.sh).
        - base_url: http://10.30.1.57:8080
          name: qBittorrent
          username: !ENV QBIT_USERNAME
          password: !ENV QBIT_PASSWORD
