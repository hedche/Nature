apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seerr
  namespace: media
  labels:
    app.kubernetes.io/name: seerr
    app.kubernetes.io/part-of: media
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: seerr
      port:
        number: 5055
  tls:
    - hosts:
        # Becomes the tailnet machine name: https://seerr.<tailnet>.ts.net
        - seerr
