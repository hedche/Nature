apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: sonarr
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: media
spec:
  image: lscr.io/linuxserver/sonarr
  interval: 30m
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: sonarr
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: media
spec:
  imageRepositoryRef:
    name: sonarr
  filterTags:
    # linuxserver tags: <app version>-ls<build>; order by the lsio build number.
    pattern: '^\d+\.\d+\.\d+\.\d+-ls(?P<build>\d+)$'
    extract: '$build'
  policy:
    numerical:
      order: asc
---
