apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflare-tunnel-ingress-controller
  namespace: cloudflared
spec:
  interval: 30m
  chart:
    spec:
      chart: cloudflare-tunnel-ingress-controller
      version: "0.x"
      sourceRef:
        kind: HelmRepository
        name: strrl
        namespace: flux-system
      interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    # cloudflare-credentials is created out-of-band (not in git, not Helm-owned):
    #   kubectl -n cloudflared create secret generic cloudflare-credentials \
    #     --from-literal=api-token=<token> --from-literal=account-id=<account-id>
    # The chart renders its own cloudflare-api secret from these values, so
    # valuesFrom must NOT point at cloudflare-api (circular).
    - kind: Secret
      name: cloudflare-credentials
      valuesKey: api-token
      targetPath: cloudflare.apiToken
    - kind: Secret
      name: cloudflare-credentials
      valuesKey: account-id
      targetPath: cloudflare.accountId
  values:
    cloudflare:
      tunnelName: cereal-cluster
    ingressClass:
      isDefaultClass: false
