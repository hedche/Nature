apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflare-tunnel-ingress-controller
  namespace: cloudflared
spec:
  interval: 30m
  chart:
    spec:
      chart: cloudflare-tunnel-ingress-controller
      version: "0.x"
      sourceRef:
        kind: HelmRepository
        name: strrl
        namespace: flux-system
      interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: cloudflare-api
      valuesKey: api-token
      targetPath: cloudflare.apiToken
    - kind: Secret
      name: cloudflare-api
      valuesKey: cloudflare-account-id
      targetPath: cloudflare.accountId
  values:
    cloudflare:
      tunnelName: cereal-cluster
    ingressClass:
      isDefaultClass: false
