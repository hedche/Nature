apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 30m
  chart:
    spec:
      chart: headlamp
      version: "0.42.x"
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
      interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: headlamp
    replicaCount: 1
    config:
      inCluster: true
      inClusterContextName: cereal
      sessionTTL: 86400
    serviceAccount:
      create: true
      name: headlamp
    clusterRoleBinding:
      create: false
    service:
      type: ClusterIP
      port: 80
    ingress:
      enabled: true
      ingressClassName: tailscale
      hosts:
        - host: headlamp
          paths:
            - path: /
              type: Prefix
      tls:
        - hosts:
            - headlamp
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      privileged: false
      runAsUser: 100
      runAsGroup: 101
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault

