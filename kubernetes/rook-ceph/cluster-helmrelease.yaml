apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
  namespace: rook-ceph
spec:
  interval: 30m
  timeout: 90m
  dependsOn:
    - name: rook-ceph
      namespace: rook-ceph
  chart:
    spec:
      chart: rook-ceph-cluster
      version: "v1.19.5"
      sourceRef:
        kind: HelmRepository
        name: rook-release
        namespace: flux-system
      interval: 10m
  install:
    disableWait: true
    disableWaitForJobs: true
  upgrade:
    disableWait: true
    disableWaitForJobs: true
    remediation:
      retries: 3
  values:
    operatorNamespace: rook-ceph
    clusterName: rook-ceph
    toolbox:
      enabled: true
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 64Mi
    cephImage:
      repository: quay.io/ceph/ceph
      tag: v19.2.3
      allowUnsupported: false
    cephClusterSpec:
      dataDirHostPath: /var/lib/rook
      mon:
        count: 3
        allowMultiplePerNode: false
      mgr:
        count: 2
        allowMultiplePerNode: false
      dashboard:
        enabled: true
        ssl: true
      crashCollector:
        disable: false
      # Every Ceph daemon otherwise gets a log-collector sidecar (100m + 100Mi
      # each, 11 in total) writing logs to files under dataDirHostPath. Daemon
      # logs stay available via `kubectl logs`.
      logCollector:
        enabled: false

      # BlueStore cache sizing. osd_memory_base is 768Mi and osd_memory_cache_min
      # is 128Mi, so a 1Gi target left the autotuner pinned at its cache floor
      # (measured: bluestore-pricache cache_bytes == osd_memory_cache_min exactly)
      # with no adaptive range. 2Gi leaves ~1.2Gi for cache. The osd memory limit
      # below is held at 2x this target so a recovery burst cannot trip an OOM.
      cephConfig:
        osd:
          osd_memory_target: "2147483648"   # 2 GiB

      # Chart defaults are sized for a production cluster (osd 1 CPU + 4Gi, mon
      # 1 CPU + 1Gi, mgr 500m each) and accounted for ~59% of this cluster's
      # allocatable CPU in requests while actually using ~360m total. Requests
      # are trimmed towards real usage; memory limits stay generous so no daemon
      # becomes more likely to be OOM-killed.
      resources:
        mon:
          limits:
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 512Mi
        osd:
          limits:
            memory: 4Gi
          requests:
            cpu: 250m
            memory: 2Gi
        # Measured steady-state mgr RSS is ~580Mi, above the old 512Mi request.
        mgr:
          limits:
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 640Mi
        mgr-sidecar:
          limits:
            memory: 100Mi
          requests:
            cpu: 10m
            memory: 40Mi
        crashcollector:
          limits:
            memory: 60Mi
          requests:
            cpu: 10m
            memory: 60Mi
        exporter:
          limits:
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 50Mi
        prepareosd:
          requests:
            cpu: 100m
            memory: 50Mi
        cleanup:
          limits:
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 100Mi

      placement:
        all:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - snap
                        - crackle
                        - pop
      storage:
        useAllNodes: false
        useAllDevices: false
        nodes:
          - name: snap
            devices:
              - name: sda
          - name: crackle
            devices:
              - name: sda
          - name: pop
            devices:
              - name: sda
      disruptionManagement:
        managePodBudgets: true
        osdMaintenanceTimeout: 30
      healthCheck:
        daemonHealth:
          mon:
            disabled: false
            interval: 45s
          osd:
            disabled: false
            interval: 60s
          status:
            disabled: false
            interval: 60s
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
            requireSafeReplicaSize: true
          parameters:
            min_size: "2"
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          parameters:
            imageFormat: "2"
            imageFeatures: layering
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
            csi.storage.k8s.io/controller-publish-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-publish-secret-namespace: rook-ceph
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
            csi.storage.k8s.io/fstype: ext4
    cephFileSystems: []
    cephObjectStores: []
