apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  interval: 30m
  timeout: 60m
  chart:
    spec:
      chart: rook-ceph
      version: "v1.20.8"
      sourceRef:
        kind: HelmRepository
        name: rook-release
        namespace: flux-system
      interval: 10m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
    csi:
      # Installs the ceph-csi-operator subchart (and its CRDs). Since v1.20 this
      # is the only CSI setting the chart takes besides image tags; the drivers
      # themselves are configured by the ceph-csi-drivers release
      # (csi-drivers-helmrelease.yaml).
      installCsiOperator: true
    # OSD devices are pinned to sda per node (see cluster-helmrelease.yaml), so
    # device discovery is redundant. This restores the chart default and frees
    # ~280Mi of real memory across the three workers.
    enableDiscoveryDaemon: false
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
