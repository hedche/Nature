apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  interval: 30m
  timeout: 60m
  chart:
    spec:
      chart: rook-ceph
      version: "v1.19.5"
      sourceRef:
        kind: HelmRepository
        name: rook-release
        namespace: flux-system
      interval: 10m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
    csi:
      installCsiOperator: true
    enableDiscoveryDaemon: true
    discoveryDaemonInterval: 10m
