apiVersion: v1
kind: ConfigMap
metadata:
  name: peanut-config
  namespace: peanut
  labels:
    app.kubernetes.io/name: peanut
data:
  ASSISTANT_NAME: "Peanut"
  BRIEFING_TITLE: "Daily priorities"
  GEMINI_MODEL: "gemini-2.5-flash-lite"
  TOP_N_FOR_LLM: "10"
  TOP_PRIORITIES: "5"
  PRIORITIES_PER_ASSIGNEE: "5"
  PRIORITIES_UNASSIGNED: "3"
  TRELLO_LIST_NAME: "Next ✨"
  BACKLOG_LIST_NAME: "Backlog 📋"
  BACKLOG_LABEL_NAME: "P1"
  BACKLOG_FALLBACK_LABEL_NAME: "P2"
  BACKLOG_TOP_N: "3"
  MEMORY_FILE_PATH: "/data/memory.json"
  # Dead-man's-switch: pinged after each successful daily briefing (e.g. a
  # healthchecks.io check URL); the service alerts when briefings go silent.
  # Empty disables the ping.
  #
  # Currently empty, so the in-cluster PeanutBriefingSilent alert
  # (kubernetes/monitoring-rules/rules/nature-peanut.yaml) is what covers this
  # gap. Setting a URL here adds an OUT-OF-BAND second path that survives the
  # whole cluster being down, which the Prometheus rule by definition cannot.
  HEALTHCHECK_PING_URL: ""
