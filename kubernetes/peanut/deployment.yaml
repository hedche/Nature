apiVersion: apps/v1
kind: Deployment
metadata:
  name: peanut
  namespace: peanut
  labels:
    app.kubernetes.io/name: peanut
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: peanut
  template:
    metadata:
      labels:
        app.kubernetes.io/name: peanut
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: peanut
          image: hedche/peanut:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          # Debug restart notification: fires on EVERY container start —
          # including each crash-loop retry — independently of the app code,
          # so a build that dies at import still announces itself. Best
          # effort: never fails the hook (a failing postStart would itself
          # kill the container).
          lifecycle:
            postStart:
              exec:
                command:
                  - python3
                  - -c
                  - |
                    import os, urllib.parse, urllib.request
                    try:
                        token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
                        chat = os.environ.get("TELEGRAM_CHAT_ID", "")
                        if token and chat:
                            text = "🐛 peanut container started — pod %s, version %s" % (
                                os.environ.get("HOSTNAME", "?"),
                                os.environ.get("APP_VERSION", "unknown"),
                            )
                            urllib.request.urlopen(
                                "https://api.telegram.org/bot%s/sendMessage" % token,
                                data=urllib.parse.urlencode(
                                    {"chat_id": chat, "text": text}
                                ).encode(),
                                timeout=10,
                            )
                    except Exception:
                        pass
          envFrom:
            - configMapRef:
                name: peanut-config
            - secretRef:
                name: peanut-secrets
          volumeMounts:
            - name: memory
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 60
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: memory
          persistentVolumeClaim:
            claimName: peanut-memory-ceph
