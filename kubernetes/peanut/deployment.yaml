apiVersion: apps/v1
kind: Deployment
metadata:
  name: peanut
  namespace: peanut
  labels:
    app.kubernetes.io/name: peanut
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: peanut
  template:
    metadata:
      labels:
        app.kubernetes.io/name: peanut
    spec:
      containers:
        - name: peanut
          image: hedche/peanut:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: peanut-config
            - secretRef:
                name: peanut-secrets
          volumeMounts:
            - name: memory
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 60
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: memory
          persistentVolumeClaim:
            claimName: peanut-memory-ceph
