apiVersion: batch/v1
kind: CronJob
metadata:
  name: peanut-daily-briefing
  namespace: peanut
  labels:
    app.kubernetes.io/name: peanut
    app.kubernetes.io/component: daily-briefing
spec:
  schedule: "30 8 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # Garbage-collect finished Jobs after 3 days.
      #
      # Without this, failedJobsHistoryLimit retains exactly 3 failed Jobs, and
      # once three failures accumulate they are never evicted — no new failure
      # arrives to push them out. Upstream's KubeJobFailed alert has no time
      # bound, so it fires on any surviving failed Job: three briefings that
      # failed on 2026-08-29/30/31 and then succeeded were still paging on
      # 09-02, long after the problem had gone away. Three days is enough to
      # investigate a failure and short enough that a fixed one stops shouting.
      ttlSecondsAfterFinished: 259200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: peanut
            app.kubernetes.io/component: daily-briefing
        spec:
          restartPolicy: OnFailure
          # Must match the Deployment's securityContext exactly: both pods share
          # the same RWO PVC, so a differing fsGroup would thrash its ownership.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: Always
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # memory.py:34 write_text() has no local handler, so a /data
            # permission fault kills the run BEFORE send_briefing — a silently
            # missing briefing. Fail here instead, where KubeJobFailed sees it.
            - name: assert-data-writable
              image: hedche/peanut:latest
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command:
                - sh
                - -euc
                - |
                  test -w /data || { echo "FATAL: /data not writable by $(id -u):$(id -g)"; ls -lna /data; exit 1; }
                  for f in /data/memory.json /data/telegram_messages.jsonl; do
                    [ -e "$f" ] || continue
                    test -w "$f" || { echo "FATAL: $f not writable by $(id -u):$(id -g)"; ls -lna /data; exit 1; }
                  done
                  echo "data volume writable OK"
              volumeMounts:
                - name: memory
                  mountPath: /data
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: peanut
                      app.kubernetes.io/component: web
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: peanut
              image: hedche/peanut:latest
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command:
                - python
                - -m
                - app.run
              envFrom:
                - configMapRef:
                    name: peanut-config
                - secretRef:
                    name: peanut-secrets
              env:
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: memory
                  mountPath: /data
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: memory
              persistentVolumeClaim:
                claimName: peanut-memory-ceph
