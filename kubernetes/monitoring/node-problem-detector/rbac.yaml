apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-problem-detector
  namespace: monitoring
  labels:
    app.kubernetes.io/name: node-problem-detector
    app.kubernetes.io/part-of: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-problem-detector
  labels:
    app.kubernetes.io/name: node-problem-detector
    app.kubernetes.io/part-of: monitoring
rules:
  # NPD reports problems by writing Node Conditions, which is also how they reach
  # kube-state-metrics as kube_node_status_condition and therefore Grafana Cloud.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
  - apiGroups: [""]
    resources: [nodes/status]
    verbs: [patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-problem-detector
  labels:
    app.kubernetes.io/name: node-problem-detector
    app.kubernetes.io/part-of: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: node-problem-detector
subjects:
  - kind: ServiceAccount
    name: node-problem-detector
    namespace: monitoring
