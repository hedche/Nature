apiVersion: v1
kind: ConfigMap
metadata:
  name: node-problem-detector-kernel-monitor
  namespace: monitoring
  labels:
    app.kubernetes.io/name: node-problem-detector
    app.kubernetes.io/part-of: monitoring
data:
  # Verified on the live cluster: `talosctl -n 10.30.1.52 dmesg` returns kernel
  # messages AND Talos service logs (`[talos] …` at user.warning) from one ring
  # buffer. So a single /dev/kmsg reader sees both the DMAR faults and the Talos
  # block-controller lock loop — no Talos API credential needed in-cluster.
  #
  # BlockDeviceLockLoop is `temporary`, NOT `permanent`, and that is deliberate.
  # Talos logs "failed to lock device, retrying later" once per worker during
  # normal boot — it retries and succeeds — so as a permanent rule it latched a
  # node condition that never clears. Measured 2026-09-04: BlockDeviceLockLoop
  # was True on 3 of 4 nodes (pop and snap for two days) while every one of them
  # was perfectly healthy, all reporting the same benign message on sda. A
  # condition that is True on healthy nodes carries no information, and it cost
  # a real misdiagnosis: crackle's outage was blamed on it when the eviction was
  # actually the standard node.kubernetes.io/unreachable taint.
  #
  # The pathological signal is the LOOP, not one line, and a permanent rule
  # cannot express "N times" — it latches on first match. A temporary rule
  # increments problem_counter per occurrence, which is what the
  # BlockDeviceLockLoop alert already keys off (increase[5m] > 5), so a genuine
  # retry storm still pages while a single boot-time retry does not.
  #
  # Verified before changing it: problem_counter carries series for reasons that
  # exist ONLY as temporary rules here (OOMKilling, TaskHung, KernelOops,
  # EXT4Error, IOError, NVMeControllerReset), so the metric the alert depends on
  # survives the switch. problem_gauge only ever carried the permanent types.
  kernel-monitor.json: |
    {
      "plugin": "kmsg",
      "logPath": "/dev/kmsg",
      "lookback": "5m",
      "bufferSize": 10,
      "source": "kernel-monitor",
      "metricsReporting": true,
      "conditions": [
        {
          "type": "NVMeDMAFault",
          "reason": "NoNVMeDMAFaults",
          "message": "No NVMe DMA faults detected"
        },
        {
          "type": "KernelDeadlock",
          "reason": "KernelHasNoDeadlock",
          "message": "kernel has no deadlock"
        },
        {
          "type": "ReadonlyFilesystem",
          "reason": "FilesystemIsNotReadOnly",
          "message": "Filesystem is not read-only"
        }
      ],
      "rules": [
        {
          "type": "permanent",
          "condition": "NVMeDMAFault",
          "reason": "NVMeDMAFault",
          "pattern": "DMAR:.*fault.*"
        },
        {
          "type": "temporary",
          "reason": "BlockDeviceLockLoop",
          "pattern": ".*failed to lock device.*"
        },
        {
          "type": "permanent",
          "condition": "KernelDeadlock",
          "reason": "AUFSUmountHung",
          "pattern": "task umount\\.aufs:\\w+ blocked for more than \\w+ seconds\\."
        },
        {
          "type": "permanent",
          "condition": "KernelDeadlock",
          "reason": "DockerHung",
          "pattern": "task docker:\\w+ blocked for more than \\w+ seconds\\."
        },
        {
          "type": "permanent",
          "condition": "ReadonlyFilesystem",
          "reason": "FilesystemReadOnly",
          "pattern": "Remounting filesystem read-only"
        },
        {
          "type": "temporary",
          "reason": "OOMKilling",
          "pattern": "Killed process \\d+ (.+) total-vm:\\d+kB, anon-rss:\\d+kB, file-rss:\\d+kB.*"
        },
        {
          "type": "temporary",
          "reason": "TaskHung",
          "pattern": "task \\S+:\\w+ blocked for more than \\w+ seconds\\."
        },
        {
          "type": "temporary",
          "reason": "KernelOops",
          "pattern": "BUG: unable to handle kernel NULL pointer dereference at .*"
        },
        {
          "type": "temporary",
          "reason": "EXT4Error",
          "pattern": "EXT4-fs error .*"
        },
        {
          "type": "temporary",
          "reason": "IOError",
          "pattern": "Buffer I/O error on device .*"
        },
        {
          "type": "temporary",
          "reason": "NVMeControllerReset",
          "pattern": "nvme nvme\\d+: (resetting controller|I/O \\d+ QID \\d+ timeout).*"
        }
      ]
    }
