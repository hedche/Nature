apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: monitoring
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: kube-prometheus-stack-alertmanager
      port:
        number: 9093
  tls:
    - hosts:
        # Becomes the tailnet machine name: https://alertmanager.<tailnet>.ts.net
        # No authentication — tailnet ACL only. Never expose through cloudflared.
        - alertmanager
