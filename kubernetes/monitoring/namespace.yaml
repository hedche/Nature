apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/part-of: monitoring
    # The cluster-wide PSA default is `enforce: baseline` (talos/controlplane.yaml,
    # cluster.apiServer.admissionControl). node-exporter needs hostPath /proc, /sys
    # and /, node-problem-detector needs the /dev/kmsg char device plus hostNetwork
    # to reach kubelet healthz on 127.0.0.1:10248, and blackbox-exporter needs
    # NET_RAW for ICMP. All are blocked at `baseline`, so this namespace opts up.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
