apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: monitoring
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: kube-prometheus-stack-prometheus
      port:
        number: 9090
  tls:
    - hosts:
        # Becomes the tailnet machine name: https://prometheus.<tailnet>.ts.net
        # The UI has no authentication — the tailnet ACL is the boundary, same as
        # headlamp. Never expose this through cloudflared.
        - prometheus
