apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: flux-failures
  namespace: flux-system
spec:
  providerRef:
    name: telegram
  eventSeverity: error
  eventSources:
    - kind: GitRepository
      name: "*"
    - kind: Kustomization
      name: "*"
    - kind: HelmRelease
      name: "*"
    - kind: HelmRepository
      name: "*"
    - kind: ImageUpdateAutomation
      name: "*"
  exclusionList:
    # Both are transient during node restarts and reconcile ordering. The
    # FluxReconciliationFailing PrometheusRule covers the case that actually
    # matters — still broken 15 minutes later — so don't page on the flapping.
    - "waiting for rollout to finish"
    - "dependency .* is not ready"
  suspend: false
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: flux-info
  namespace: flux-system
spec:
  providerRef:
    name: telegram
  eventSeverity: info
  eventSources:
    - kind: Kustomization
      name: "*"
  # Deploy-success chatter. Off by default; flip to false if you want it.
  suspend: true
